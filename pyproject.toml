[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "filing-qa"
version = "2.0.0"
description = "Enterprise-grade multimodal RAG system for financial document analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RAG Financial Team", email = "team@example.com" }]
keywords = ["rag", "financial", "multimodal", "llm", "vector-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: what `import filing_qa` and the CLI need. Everything heavier is an extra.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.15",
    "rich>=13.7",
    "pyyaml>=6.0.1",
    "pypdf>=4.0",
    "prometheus-client>=0.20",
    "psutil>=5.9",
    "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
# Serving
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
# Vector stores (VECTOR_STORE_CONFIG__PROVIDER)
# deeplake 3.9.51+ declares pillow~=10.4.0, which holds pillow at 10.4.x for the whole lock.
# 3.9.50 is no way out: it pins numpy==1.26.4, and its missing pillow requirement was a
# packaging mistake fixed upstream in activeloopai/deeplake#3072. Revisit when DeepLake stops
# being the default vector store (port to v4 or drop it).
deeplake = ["deeplake>=3.9,<4", "numpy>=1.26"]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["asyncpg>=0.29"]
# Parsing (PDF_PARSING_CONFIG__PRIMARY_PARSER)
parsing = ["unstructured[pdf]>=0.15", "pandas>=2.2"]
docling = ["docling>=2.0"]
# Local embedder and cross-encoder / BGE rerankers
# torch listed directly so the CPU index below applies to it.
local-models = ["sentence-transformers>=3.0", "torch>=2.2"]
cohere = ["cohere>=5.5"]
# PII redaction with Presidio
pii = ["presidio-analyzer>=2.2.354", "presidio-anonymizer>=2.2.354"]
# Cloud storage connectors
connectors = ["boto3>=1.34", "azure-storage-blob>=12.19", "google-cloud-storage>=2.16"]
agentic = ["langgraph>=0.2"]
eval = ["ragas>=0.1.9,<0.2", "datasets>=2.19"]
observability = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
all = [
    "filing-qa[api,deeplake,qdrant,pgvector,parsing,docling,local-models,cohere,pii,connectors,agentic,eval,observability]",
]

[project.scripts]
filing-qa = "filing_qa.cli:main_cli"

[project.urls]
Homepage = "https://github.com/Mattral/filing-qa"
Repository = "https://github.com/Mattral/filing-qa"
Issues = "https://github.com/Mattral/filing-qa/issues"
Changelog = "https://github.com/Mattral/filing-qa/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
]
# Pinned so a new formatter or linter release cannot turn main red on its own.
lint = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "black==26.10.1",
    "isort==9.0.2",
    "types-pyyaml",
    "types-redis",
]
load = ["locust>=2.28"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.hatch.build.targets.wheel]
packages = ["src/filing_qa"]

[tool.uv]
default-groups = ["dev"]

# CPU-only torch on Linux keeps the image and CI downloads small.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ── Tool configs ─────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["filing_qa"]
line_length = 100

[tool.ruff]
src = ["src", "."]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# UP006/UP007/UP035/UP045: this codebase deliberately uses typing.Optional/List/Dict
# throughout rather than PEP 604/585 (`X | None`, `list[X]`) syntax, for consistency
# with the existing style and readability in a large team codebase. This is a style
# choice, not a correctness issue — do not "fix" these individually; if the team
# decides to migrate styles, do it as one deliberate, fully-tested sweep, not via
# scattered --fix runs that could silently touch behavior in edge cases (e.g. runtime
# isinstance checks against typing constructs).
# UP042: (str, Enum) -> StrEnum would change str()/f-string output from
# "QueryIntent.FACTUAL" to "factual" (confirmed via direct testing on this
# Python version). Every usage in this codebase already explicitly calls
# .value, so the change has zero functional benefit here while carrying a
# real behavior-change risk for any callsite not caught by this audit.
ignore = ["E501", "B008", "UP006", "UP007", "UP035", "UP045", "UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["tests/", "evals/", ".venv/"]

[[tool.mypy.overrides]]
module = ["deeplake.*", "unstructured.*", "ragas.*", "locust.*", "presidio_analyzer.*", "presidio_anonymizer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths       = ["tests"]
pythonpath      = ["src"]
asyncio_mode    = "auto"
addopts         = """
  --strict-markers
  --tb=short
  -v
  --cov=src/filing_qa
  --cov-report=term-missing
  --cov-report=html:htmlcov
  --cov-report=xml:coverage.xml
  --cov-fail-under=70
"""
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: integration tests (may use in-memory components)",
    "slow: tests taking >5s",
    "requires_openai: tests that need a live OpenAI key",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:langchain.*",
]

[tool.coverage.run]
source    = ["src/filing_qa"]
omit      = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]
branch    = true

[tool.coverage.report]
show_missing  = true
skip_covered  = false
fail_under    = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abc.abstractmethod",
]
