name: CI/CD

# Every job in this workflow gates merges. Advisory checks that are allowed to fail
# (vulnerability scanners, the LLM eval gate) live in advisory.yml, so they do not
# share this workflow's badge.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # Tool versions are pinned in the `lint` dependency group (pyproject.toml + uv.lock).
      - name: Install lint deps from the lockfile
        run: uv sync --frozen --no-default-groups --group lint

      # Every step below is blocking.
      - name: Ruff lint
        run: uv run --no-sync ruff check src/ tests/ evals/

      - name: Black format check
        run: uv run --no-sync black --check src/ tests/ evals/

      - name: isort check
        run: uv run --no-sync isort --check-only src/ tests/ evals/

      - name: mypy type check
        run: uv run --no-sync mypy src/filing_qa/config.py src/filing_qa/components/base.py

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install test deps from the lockfile
        run: uv sync --frozen --no-default-groups --group test --extra api --extra qdrant

      # Blocking: a failing test or coverage below 70% fails the job.
      - name: Run unit + integration tests (combined coverage)
        run: |
          uv run --no-sync pytest tests/unit/ tests/integration/ -v --timeout=30 \
            --cov=src/filing_qa \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70
        env:
          ENVIRONMENT: testing

      # Reporting only: an outage at Codecov should not fail the build.
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Every vector store adapter against its real backend: upsert, query, reopen,
  # query. The other test jobs only see these adapters through mocks.
  vector-stores:
    name: Vector Store Round-Trip
    runs-on: ubuntu-latest
    needs: lint
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install test deps and vector store clients from the lockfile
        run: |
          uv sync --frozen --no-default-groups --group test \
            --extra deeplake --extra qdrant --extra pgvector

      - name: Wait for Qdrant
        run: |
          for i in $(seq 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" && exit 1

      # -rs lists skipped cases; the step fails if any backend was skipped.
      - name: Run round-trip tests
        run: |
          set -o pipefail
          uv run --no-sync pytest tests/integration/test_vector_store_roundtrip.py -v -rs --timeout=60 \
            --no-cov | tee roundtrip.log
          if grep -q SKIPPED roundtrip.log; then
            echo "A vector store backend was skipped in CI" && exit 1
          fi
        env:
          ENVIRONMENT: testing
          TEST_QDRANT_URL: http://localhost:6333
          TEST_PGVECTOR_DSN: postgresql://rag:rag@localhost:5432/rag

  # ─────────────────────────────────────────────────────────────────────────
  # Installs the built wheel (not the source tree) into a clean venv and runs it
  # from outside the checkout, so a broken import path or entry point fails here.
  package:
    name: Wheel Install Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel --out-dir dist/

      # Plain pip on purpose: this checks the wheel as a user installs it from PyPI.
      - name: Install wheel into a clean venv
        run: |
          uv venv --seed /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl

      - name: Import and run the CLI from outside the checkout
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python -c "import filing_qa.cli"
          /tmp/wheel-venv/bin/filing-qa --help

  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, helm-lint, package, vector-stores]
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime

  # ─────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - uses: azure/setup-kubectl@v4

      - name: Helm lint
        run: helm lint helm/rag-financial/ --set config.qdrantUrl=http://qdrant:6333

      - name: Helm template + kubeconform validate
        run: |
          helm template rag-financial helm/rag-financial/ --debug \
            --set config.qdrantUrl=http://qdrant:6333 > /tmp/helm-rendered.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/helm-rendered.yaml

      # The chart does not deploy Qdrant, so rendering without its URL must fail loudly.
      - name: Helm template fails without a Qdrant URL
        run: |
          if helm template rag-financial helm/rag-financial/ > /tmp/no-url.yaml 2> /tmp/no-url.err; then
            echo "helm template succeeded without config.qdrantUrl" && exit 1
          fi
          grep -q "config.qdrantUrl is required" /tmp/no-url.err

      - name: kubeconform validate k8s/base manifests
        run: |
          kubectl kustomize k8s/base/ > /tmp/k8s-base-rendered.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/k8s-base-rendered.yaml
