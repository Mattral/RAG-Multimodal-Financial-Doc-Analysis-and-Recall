name: CI/CD

# Every job in this workflow gates merges. Advisory checks that are allowed to fail
# (vulnerability scanners, the LLM eval gate) live in advisory.yml, so they do not
# share this workflow's badge.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Pinned so a new formatter or linter release cannot turn main red on its own.
      - name: Install lint deps
        run: |
          pip install ruff==0.17.0 mypy==2.4.0 black==26.10.1 isort==9.0.2             pydantic pydantic-settings structlog

      # Every step below is blocking.
      - name: Ruff lint
        run: ruff check src/ tests/ evals/

      - name: Black format check
        run: black --check src/ tests/ evals/

      - name: isort check
        run: isort --check-only src/ tests/ evals/

      - name: mypy type check
        run: mypy src/rag_system/config.py src/rag_system/components/base.py

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test deps
        run: |
          pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout \
            pydantic pydantic-settings structlog httpx numpy \
            hypothesis pypdf fastapi python-multipart qdrant-client \
            typer rich pyyaml

      # Blocking: a failing test or coverage below 70% fails the job.
      - name: Run unit + integration tests (combined coverage)
        run: |
          pytest tests/unit/ tests/integration/ -v --timeout=30 \
            --cov=src/rag_system \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70
        env:
          ENVIRONMENT: testing

      # Reporting only: an outage at Codecov should not fail the build.
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, helm-lint]
    if: github.event_name == 'push' || github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime

  # ─────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - uses: azure/setup-kubectl@v4

      - name: Helm lint
        run: helm lint helm/rag-financial/

      - name: Helm template + kubeconform validate
        run: |
          helm template rag-financial helm/rag-financial/ --debug > /tmp/helm-rendered.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/helm-rendered.yaml

      - name: kubeconform validate k8s/base manifests
        run: |
          kubectl kustomize k8s/base/ > /tmp/k8s-base-rendered.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/k8s-base-rendered.yaml
