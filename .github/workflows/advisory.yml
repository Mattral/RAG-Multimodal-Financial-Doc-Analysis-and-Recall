name: Advisory (non-gating)

# These checks report findings but do not block merges, and they are kept out of
# ci.yml so that the CI badge only reflects checks that gate.
#   - Vulnerability and static-analysis scanners: soft until the existing findings
#     are triaged. To make one gating, drop its soft setting and move it to ci.yml.
#   - Eval regression: CI has no LLM key or budget, so the eval cannot run end to end.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # nightly, 03:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          exit-code: "0"   # report only; set to 1 to block on CRITICAL/HIGH
          severity: CRITICAL,HIGH

      - name: Grype vulnerability scan
        uses: anchore/scan-action@v4
        id: grype
        with:
          path: "."
          fail-build: false   # report only
          severity-cutoff: critical

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true   # needs code scanning enabled on the repo
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

      - name: Semgrep static analysis
        uses: semgrep/semgrep-action@v1
        continue-on-error: true   # report only
        with:
          config: >-
            p/python
            p/security-audit
            p/secrets

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # Audits exactly what uv.lock installs. The deeplake extra is resolved separately
      # (it conflicts with `parsing`), so both resolutions are exported and audited.
      - name: pip-audit
        run: |
          uv export --frozen --all-extras --no-extra deeplake --no-dev --no-emit-project \
            --no-hashes -o "$RUNNER_TEMP/locked-main.txt"
          uv export --frozen --extra deeplake --no-dev --no-emit-project \
            --no-hashes -o "$RUNNER_TEMP/locked-deeplake.txt"
          for f in locked-main.txt locked-deeplake.txt; do
            echo "== $f"
            uvx pip-audit --requirement "$RUNNER_TEMP/$f" --no-deps --disable-pip || true   # report only
          done

  # ─────────────────────────────────────────────────────────────────────────
  eval-regression:
    name: Eval Regression (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install deps from the lockfile
        run: uv sync --frozen --no-default-groups

      - name: Run eval regression check
        run: uv run --no-sync python -m evals.run_evals --fail-on-regression --output evals/ci_report.json
        env:
          ENVIRONMENT: testing
          VECTOR_STORE_CONFIG__PROVIDER: memory
        continue-on-error: true   # no LLM key in CI; see the header comment

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/ci_report.json
          if-no-files-found: ignore
        if: always()
